<main class="container app-view" id="tunerView">
  <section class="hero tuner-hero"><div><h1>Afinador</h1></div></section>
  <section class="panel tuner-card" id="tunerCard">
    <div class="tuner-gauge" id="tunerGauge">
      <svg viewBox="0 0 300 172" aria-hidden="true">
        <defs><linearGradient id="tgArc" x1="0" x2="1"><stop offset="0" stop-color="#f4aa9c"/><stop offset=".42" stop-color="#bcd8f5"/><stop offset=".5" stop-color="#4f86d6"/><stop offset=".58" stop-color="#bcd8f5"/><stop offset="1" stop-color="#f4aa9c"/></linearGradient></defs>
        <path class="tuner-arc" d="M56.8 56.8 A132 132 0 0 1 243.2 56.8" transform="rotate(0 150 150)"/>
        <g id="tunerTicks" class="tuner-ticks"></g>
        <path class="tuner-zone" d="M143.8 18.1 A132 132 0 0 1 156.2 18.1"/>
        <g class="tuner-needle" id="tunerNeedle"><line x1="150" y1="150" x2="150" y2="34"/><circle cx="150" cy="150" r="8"/></g>
        <text x="40" y="168" class="tuner-scale">−50</text><text x="260" y="168" class="tuner-scale" text-anchor="end">+50</text>
      </svg>
      <div class="tuner-readout"><div class="tuner-note" id="tunerNote">—</div><div class="tuner-cents" id="tunerCents"></div></div>
    </div>
    <p class="tuner-sub" id="tunerSub"></p>
    <div class="tuner-level" id="tunerLevel" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span class="tuner-level-bar"><i></i></span></div>
    <p class="tuner-status" id="tunerStatus" data-kind="idle" aria-live="polite"></p>
    <button class="tuner-start" id="tunerStart" type="button" aria-pressed="false">Empezar a afinar</button>
    <p class="tuner-msg" id="tunerMsg" role="alert"></p>
  </section>
  <section class="panel tuner-strings-panel">
    <div class="tuner-strings-head"><h3 class="panel-title">Cuerdas</h3><button class="tuner-auto is-on" id="tunerAuto" type="button" aria-pressed="true">Auto</button></div>
